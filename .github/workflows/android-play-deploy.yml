name: Android Play Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (Android versionCode) to embed. Should match the CI/CD run number used for the release tag."
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  ANDROID_PACKAGE_NAME: "com.vitorhugo.sonicrelay.sonic_relay"
  PLAY_TRACK: "internal"

jobs:
  deploy-google-play:
    name: Deploy signed AAB to Google Play internal testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate deployment secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Create Google Play service account file
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Resolve build number
        id: build_number
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
            echo "Using build number from workflow_dispatch input: $BUILD_NUMBER"
          elif [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == *+* ]]; then
            BUILD_NUMBER="${REF_NAME##*+}"
            echo "Using build number parsed from tag $REF_NAME: $BUILD_NUMBER"
          else
            BUILD_NUMBER="$RUN_NUMBER"
            echo "::warning::No build_number input and no version tag found; falling back to this workflow's own run number ($BUILD_NUMBER), which will NOT match the CI/CD release tag."
          fi
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed Android App Bundle
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: flutter build appbundle --release --flavor play --build-number "$BUILD_NUMBER"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-relay-play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Install Fastlane
        run: |
          gem install fastlane --user-install --no-document
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Upload to Google Play internal testing
        run: |
          fastlane supply \
            --aab build/app/outputs/bundle/playRelease/app-play-release.aab \
            --track "$PLAY_TRACK" \
            --release_status completed \
            --json_key play-service-account.json \
            --package_name "$ANDROID_PACKAGE_NAME" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true
